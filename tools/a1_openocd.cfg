# zA1 / EMW3080B (MX1290 / RTL8710B) J-Link SWD config for OpenOCD 0.12
adapter driver jlink
transport select swd
adapter speed 1000

source [find target/swj-dp.tcl]

set _CHIPNAME MX1290
set _CPUTAPID 0x4ba00477

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -endian little -dap $_CHIPNAME.dap
$_CHIPNAME.cpu configure -work-area-phys 0x10005000 -work-area-size 0x4000 -work-area-backup 0

reset_config none
cortex_m reset_config vectreset

$_CHIPNAME.cpu configure -event reset-end {
  mww 0x40000210 0x00010113
  mww 0x40000214 0x00000000
}
